name: Build TWRP (Multilaser F Pro 2)

# Put the device tree at the ROOT of this repository (BoardConfig.mk, device.mk, prebuilt/, recovery/ ...)
# Save this file as .github/workflows/build-twrp.yml

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "TWRP minimal manifest branch"
        default: "twrp-11"
      lunch_prefix:
        description: "Product prefix used by the device tree (omni or twrp)"
        default: "omni"
      build_variant:
        description: "Build variant"
        default: "eng"
      publish:
        description: "Publish a pre-release on GitHub"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DEVICE: Multilaser_F_Pro_2
  VENDOR: multilaser
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 rsync cpio file \
            openjdk-11-jdk

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: dt

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"

      - name: Sync TWRP minimal manifest
        run: |
          mkdir -p "$HOME/twrp" && cd "$HOME/twrp"
          repo init --depth=1 -u "$MANIFEST_URL" -b "${{ inputs.manifest_branch }}"
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Copy device tree
        run: |
          DEST="$HOME/twrp/device/$VENDOR/$DEVICE"
          mkdir -p "$DEST"
          rsync -a --exclude='.git' --exclude='.github' "$GITHUB_WORKSPACE/dt/" "$DEST/"
          ls -la "$DEST"
          test -f "$DEST/BoardConfig.mk" || { echo "BoardConfig.mk not found at the repo root"; exit 1; }

      - name: Build boot image (recovery-as-boot)
        run: |
          cd "$HOME/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          set +e
          source build/envsetup.sh
          lunch "${{ inputs.lunch_prefix }}_${DEVICE}-${{ inputs.build_variant }}" 2>&1 | tee "$HOME/build.log"
          mka -j"$(nproc --all)" bootimage 2>&1 | tee -a "$HOME/build.log"
          STATUS=${PIPESTATUS[0]}
          exit $STATUS
        shell: bash

      - name: Check output
        run: |
          OUT="$HOME/twrp/out/target/product/$DEVICE"
          test -f "$OUT/boot.img" || { echo "boot.img was not produced"; ls -la "$OUT"; exit 1; }

          # The init.recovery.*.rc files must be inside the recovery ramdisk
          RC=$(ls "$OUT"/recovery/root/init.recovery.*.rc 2>/dev/null | wc -l)
          echo "init.recovery.*.rc files found: $RC"
          test "$RC" -ge 1 || { echo "init.recovery.*.rc missing from recovery/root"; exit 1; }

          # boot_a / boot_b are 64 MiB on this device
          SIZE=$(stat -c%s "$OUT/boot.img")
          echo "boot.img size: $SIZE bytes"
          test "$SIZE" -le 67108864 || { echo "boot.img is larger than the 64 MiB boot partition"; exit 1; }

          cd "$OUT" && sha256sum boot.img | tee boot.img.sha256

      - name: Set release info
        id: info
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}-${{ steps.info.outputs.date }}
          path: |
            ~/twrp/out/target/product/${{ env.DEVICE }}/boot.img
            ~/twrp/out/target/product/${{ env.DEVICE }}/boot.img.sha256

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/build.log

      - name: Publish pre-release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-${{ steps.info.outputs.date }}
          name: twrp-${{ steps.info.outputs.date }}-UNOFFICIAL-F_Pro_2
          prerelease: true
          files: |
            ~/twrp/out/target/product/${{ env.DEVICE }}/boot.img
            ~/twrp/out/target/product/${{ env.DEVICE }}/boot.img.sha256
          body: |
            UNOFFICIAL and UNTESTED TWRP build for the Multilaser F Pro 2 (Unisoc SC9832E, Android 11).

            This device uses recovery-as-boot: the image is a boot.img, not a recovery.img.
            Back up your original boot and vbmeta partitions before flashing anything.
